<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Practical Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1e2430; --ink-soft:#5c6472; --line:#e2e6ec;
  --primary:#2e5aa8; --primary-dark:#1f3f7a; --primary-soft:#e8effa;
  --accent:#1e8f6a; --accent-soft:#e6f5ef; --shadow:0 1px 3px rgba(20,30,50,0.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',sans-serif;line-height:1.75;-webkit-text-size-adjust:100%;padding-bottom:40px;}
.wrap{max-width:760px;margin:0 auto;padding:0 12px;}
header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:22px 14px 18px;text-align:center;}
header h1{margin:0 0 4px;font-size:21px;font-weight:700;}
header p{margin:0;font-size:13px;opacity:.9;}
.stickybar{background:var(--bg);padding:12px 0 8px;}
.progresswrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.toprow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px;}
.toprow b{color:var(--primary);font-family:'JetBrains Mono',monospace;}
.progressbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),#27b58a);width:0%;transition:width .3s;}
.linkbtn{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0 0 0 10px;font-family:inherit;}
.searchbox{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;font-family:inherit;background:var(--card);margin-bottom:10px;}
.searchbox:focus{outline:none;border-color:var(--primary);}
.filterrow{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft);padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
#count-info{font-size:12px;color:var(--ink-soft);margin:6px 2px 2px;}
.grouplabel{font-size:12.5px;color:var(--primary);font-weight:700;margin:18px 2px 6px;}

.exp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;}
.exp.done{border-left:4px solid var(--accent);}
.ehead{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;}
.enum{flex:0 0 auto;background:var(--primary-soft);color:var(--primary-dark);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;min-width:28px;text-align:center;}
.exp.done .enum{background:var(--accent-soft);color:var(--accent);}
.etitle{flex:1;font-size:14.5px;font-weight:600;}
.earrow{color:var(--ink-soft);font-size:12px;transition:transform .2s;margin-top:3px;}
.exp.open .earrow{transform:rotate(90deg);}
.ebody{display:none;padding:4px 16px 16px;border-top:1px dashed var(--line);font-size:14px;color:#2c3340;}
.exp.open .ebody{display:block;}
.ebody h3{margin:16px 0 4px;font-size:13.5px;color:var(--primary-dark);border-bottom:1.5px solid var(--primary-soft);padding-bottom:2px;}
.ebody ol,.ebody ul{margin:4px 0;padding-left:22px;}
.ebody p{margin:4px 0;}
.step{margin:10px 0 0;}
.step b{display:block;color:var(--ink);font-size:14px;}
.step span{color:#3a4252;}
.tag{display:inline-block;font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px;margin-left:6px;font-weight:700;vertical-align:middle;}
table.demo{border-collapse:collapse;margin:6px 0;font-size:13px;}
table.demo td,table.demo th{border:1px solid var(--line);padding:3px 10px;text-align:center;}
table.demo th{background:var(--primary-soft);}
code{font-family:'JetBrains Mono',monospace;background:#eef1f5;padding:0 5px;border-radius:4px;font-size:12.5px;}
.checkrow{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
.checkrow input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;}
@media print{
  .stickybar,header{display:none;}
  body{background:#fff;}
  .exp{box-shadow:none;page-break-after:always;border:none;}
  .ebody{display:block!important;}
  .earrow,.checkrow{display:none;}
}
</style>
</head>

const STORAGE_KEY = "ict_practical_progress_v1";
let openSet = new Set();

function getP(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return {};} }
function setP(p){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(p));}catch(e){} }
function toggleDone(n,c){
  const p=getP(); if(c) p[n]=true; else delete p[n]; setP(p);
  if(c) openSet.delete(n);
  updateProgress(); renderList();
  if(c) scrollToCard(n);
}
/* অন্য ওয়েবসাইটের ভেতরে ব্যবহার করলে পুরো পেজ নয়, শুধু নিকটতম স্ক্রলযোগ্য কন্টেইনার স্ক্রল হবে।
   স্ক্রল একেবারে বন্ধ করতে AUTO_SCROLL = false করুন। */
const AUTO_SCROLL = true;
function scrollParentOf(el){
  let n = el.parentElement;
  while(n && n !== document.body && n !== document.documentElement){
    const oy = getComputedStyle(n).overflowY;
    if((oy==='auto' || oy==='scroll') && n.scrollHeight > n.clientHeight) return n;
    n = n.parentElement;
  }
  return null;
}
function scrollToCard(n){
  if(!AUTO_SCROLL) return;
  const el=document.getElementById('exp-'+n); if(!el) return;
  const off=8;
  const box=scrollParentOf(el);
  if(box){
    const d=el.getBoundingClientRect().top - box.getBoundingClientRect().top - off;
    box.scrollBy({top:d,behavior:'smooth'});
  }else{
    window.scrollBy({top:el.getBoundingClientRect().top - off,behavior:'smooth'});
  }
}
function resetProgress(){ if(confirm("সব অগ্রগতি মুছে ফেলতে চান?")){ setP({}); updateProgress(); renderList(); } }
function updateProgress(){
  const done=Object.keys(getP()).length, total=exps.length;
  document.getElementById("progress-text").textContent=done+"/"+total;
  document.getElementById("progress-fill").style.width=(total?done/total*100:0)+"%";
}
function bodyHTML(e,p){
  let h="";
  h+="<h3>উদ্দেশ্য (Objective)</h3><ol>"+e.obj.map(o=>"<li>"+o+"</li>").join("")+"</ol>";
  h+="<h3>তত্ত্ব (Theory)</h3><p>"+e.theory+"</p>";
  h+="<h3>প্রয়োজনীয় উপকরণ (Required Equipment)</h3><ul>"+e.equip.map(o=>"<li>"+o+"</li>").join("")+"</ul>";
  h+="<h3>কার্যপ্রণালী (Procedure)</h3>";
  e.steps.forEach((s,i)=>{ h+="<div class='step'><b>ধাপ "+toBn(i+1)+" : "+s[0]+"</b><span>"+s[1]+"</span></div>"; });
  h+="<h3>ফলাফল (Result)</h3><p>"+e.result+"</p>";
  h+="<h3>উপসংহার (Conclusion)</h3><p>"+e.concl+"</p>";
  h+="<div class='checkrow'><input type='checkbox' id='chk-"+e.n+"' "+(p[e.n]?"checked":"")+"><label for='chk-"+e.n+"'>সম্পন্ন হিসেবে চিহ্নিত করুন</label></div>";
  return h;
}
function toBn(n){ return String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]); }

function renderList(){
  const p=getP(), list=document.getElementById("list"); list.innerHTML="";
  exps.forEach(e=>{
    const card=document.createElement("div");
    card.className="exp"+(p[e.n]?" done":"")+(openSet.has(e.n)?" open":"");
    card.id="exp-"+e.n;
    const head=document.createElement("div"); head.className="ehead";
    head.onclick=()=>{ const wasOpen=openSet.has(e.n); openSet.clear(); if(!wasOpen) openSet.add(e.n); renderList(); if(!wasOpen) scrollToCard(e.n); };
    head.innerHTML="<div class='enum'>"+e.n+"</div><div class='etitle'>"+e.title+"</div><div class='earrow'>▶</div>";
    card.appendChild(head);
    const body=document.createElement("div"); body.className="ebody";
    body.innerHTML=bodyHTML(e,p);
    card.appendChild(body);
    list.appendChild(card);
    const chk=body.querySelector("input");
    chk.onclick=ev=>{ ev.stopPropagation(); toggleDone(e.n,chk.checked); };
  });
}
updateProgress(); renderList();
</script>
